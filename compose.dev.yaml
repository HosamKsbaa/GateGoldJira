name: gategoldjira-dev
services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: gategoldjira
      POSTGRES_USER: gategoldjira
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gategoldjira -d gategoldjira"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
