<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1097px;height:631px;background:#FFFFFF;" width="1097px" height="631px" viewBox="0 0 1097 631" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="356.197" y="24.966" fill="#000" font-size="14" textLength="378.293" font-weight="700">GateGoldJira - A simple view of the proposed database</text></g><!--entity access--><g class="entity" data-qualified-name="access" id="ent0001" data-source-line="15"><rect x="414" y="47.068" width="272.077" height="81.29" fill="#DBEAFE" style="stroke:#CBD5E1;stroke-width:0.5;" rx="6" ry="6"/><text x="424" y="73.103" fill="#000" font-size="15" textLength="147.421" font-weight="700">Projects and people</text><text x="424" y="93.533" fill="#000" font-size="15" textLength="252.077">Projects, accounts and membership</text><text x="424" y="113.963" fill="#000" font-size="15" textLength="231.542">Project admin / member / viewer</text></g><!--entity workflow--><g class="entity" data-qualified-name="workflow" id="ent0002" data-source-line="16"><rect x="7" y="173.068" width="335.962" height="81.29" fill="#EDE9FE" style="stroke:#CBD5E1;stroke-width:0.5;" rx="6" ry="6"/><text x="17" y="199.103" fill="#000" font-size="15" textLength="79.861" font-weight="700">Workflows</text><text x="17" y="219.533" fill="#000" font-size="15" textLength="263.762">Stages, allowed moves and approvals</text><text x="17" y="239.963" fill="#000" font-size="15" textLength="315.962">Types choose defaults; issues keep their flow</text></g><!--entity work--><g class="entity" data-qualified-name="work" id="ent0003" data-source-line="17"><rect x="388.5" y="173.068" width="322.507" height="81.29" fill="#DBEAFE" style="stroke:#CBD5E1;stroke-width:0.5;" rx="6" ry="6"/><text x="398.5" y="199.103" fill="#000" font-size="15" textLength="46.92" font-weight="700">Issues</text><text x="398.5" y="219.533" fill="#000" font-size="15" textLength="271.442">Title, type, priority, assignee and dates</text><text x="398.5" y="239.963" fill="#000" font-size="15" textLength="302.507">Subtasks, blockers and typed custom fields</text></g><!--entity boards--><g class="entity" data-qualified-name="boards" id="ent0004" data-source-line="18"><rect x="756.5" y="173.068" width="327.187" height="81.29" fill="#DCFCE7" style="stroke:#CBD5E1;stroke-width:0.5;" rx="6" ry="6"/><text x="766.5" y="199.103" fill="#000" font-size="15" textLength="52.185" font-weight="700">Boards</text><text x="766.5" y="219.533" fill="#000" font-size="15" textLength="230.327">Filtered views of the same issues</text><text x="766.5" y="239.963" fill="#000" font-size="15" textLength="307.187">Independent columns, order and WIP limits</text></g><!--entity discussion--><g class="entity" data-qualified-name="discussion" id="ent0005" data-source-line="19"><rect x="269.5" y="299.068" width="275.077" height="81.29" fill="#FEF3C7" style="stroke:#CBD5E1;stroke-width:0.5;" rx="6" ry="6"/><text x="279.5" y="325.103" fill="#000" font-size="15" textLength="146.806" font-weight="700">Discussion and files</text><text x="279.5" y="345.533" fill="#000" font-size="15" textLength="254.387">Comments and retained edit history</text><text x="279.5" y="365.963" fill="#000" font-size="15" textLength="255.077">One attachment model for every file</text></g><!--entity planning--><g class="entity" data-qualified-name="planning" id="ent0006" data-source-line="20"><rect x="590" y="299.068" width="206.226" height="81.29" fill="#FCE7F3" style="stroke:#CBD5E1;stroke-width:0.5;" rx="6" ry="6"/><text x="600" y="325.103" fill="#000" font-size="15" textLength="66.69" font-weight="700">Planning</text><text x="600" y="345.533" fill="#000" font-size="15" textLength="128.761">Epics and releases</text><text x="600" y="365.963" fill="#000" font-size="15" textLength="186.226">Issue assignments to each</text></g><!--entity operations--><g class="entity" data-qualified-name="operations" id="ent0007" data-source-line="21"><rect x="416.5" y="425.068" width="266.947" height="81.29" fill="#F1F5F9" style="stroke:#CBD5E1;stroke-width:0.5;" rx="6" ry="6"/><text x="426.5" y="451.103" fill="#000" font-size="15" textLength="145.006" font-weight="700">Reliable operations</text><text x="426.5" y="471.533" fill="#000" font-size="15" textLength="246.947">Notifications, audit and safe retries</text><text x="426.5" y="491.963" fill="#000" font-size="15" textLength="204.511">Upload sessions and cleanup</text></g><!--link access to work--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk8" data-source-line="23" data-link-type="dependency"><path d="M550,128.128 C550,142.378 550,153.378 550,167.648" style="stroke:#64748B;stroke-width:1;" fill="none" id="access-to-work"/><polygon points="550,172.648,554,163.648,550,167.648,546,163.648,550,172.648" fill="#64748B" style="stroke:#64748B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="512" y="145.423" fill="#000" font-size="15" textLength="37.32">owns</text></g><!--link workflow to work--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-source-line="24" data-link-type="dependency"><path d="M343.03,214.068 C358.13,214.068 368.4,214.068 383.45,214.068" style="stroke:#64748B;stroke-width:1;" fill="none" id="workflow-to-work"/><polygon points="388.45,214.068,379.45,210.068,383.45,214.068,379.45,218.068,388.45,214.068" fill="#64748B" style="stroke:#64748B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link work to boards--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk10" data-source-line="25" data-link-type="dependency"><path d="M711.75,214.068 C726.53,214.068 736.51,214.068 751.3,214.068" style="stroke:#64748B;stroke-width:1;" fill="none" id="work-to-boards"/><polygon point